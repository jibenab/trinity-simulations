<svg viewBox="0 0 200 140" width="100%" style="max-height:120px" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pe-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent)"/>
      <stop offset="100%" stop-color="var(--accent)" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="ke-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--success)"/>
      <stop offset="100%" stop-color="var(--success)" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @media (prefers-reduced-motion: reduce) {
      .anim { animation: none !important; }
      .anim * { animateTransform: none !important; animate: none !important; animateMotion: none !important; }
    }
  </style>

  <!-- Background Grid -->
  <g stroke="var(--ink)" stroke-width="0.5" opacity="0.1">
    <line x1="25" y1="12" x2="25" y2="128"/>
    <line x1="62.5" y1="12" x2="62.5" y2="128"/>
    <line x1="100" y1="12" x2="100" y2="128"/>
    <line x1="137.5" y1="12" x2="137.5" y2="128"/>
    <line x1="175" y1="12" x2="175" y2="128"/>
    <line x1="12" y1="20" x2="188" y2="20"/>
    <line x1="12" y1="50" x2="188" y2="50"/>
    <line x1="12" y1="80" x2="188" y2="80"/>
    <line x1="12" y1="110" x2="188" y2="110"/>
  </g>

  <!-- Track -->
  <path id="energy-track" d="M 45 35 C 45 135, 155 135, 155 35" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" opacity="0.15"/>
  <path d="M 45 35 C 45 135, 155 135, 155 35" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Ghost balls at top positions -->
  <circle cx="45" cy="35" r="4.5" fill="none" stroke="var(--ink)" stroke-width="1.5" opacity="0.3"/>
  <circle cx="155" cy="35" r="4.5" fill="none" stroke="var(--ink)" stroke-width="1.5" opacity="0.3"/>

  <!-- Decorative dashed path -->
  <path d="M 45 35 L 45 15 M 155 35 L 155 15" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.3"/>

  <!-- Energy Bars Containers -->
  <rect x="22" y="35" width="8" height="75" rx="4" fill="var(--ink)" opacity="0.08"/>
  <rect x="170" y="35" width="8" height="75" rx="4" fill="var(--ink)" opacity="0.08"/>

  <g class="anim">
    <!-- PE Bar (Left) -->
    <rect x="22" y="35" width="8" height="75" rx="4" fill="url(#pe-grad)">
      <animate
        attributeName="height"
        values="75; 0; 75; 0; 75"
        dur="4s"
        repeatCount="indefinite"
        calcMode="spline"
        keyTimes="0;0.25;0.5;0.75;1"
        keySplines="0.4 0 1 1; 0 0 0.6 1; 0.4 0 1 1; 0 0 0.6 1"
      />
      <animate
        attributeName="y"
        values="35; 110; 35; 110; 35"
        dur="4s"
        repeatCount="indefinite"
        calcMode="spline"
        keyTimes="0;0.25;0.5;0.75;1"
        keySplines="0.4 0 1 1; 0 0 0.6 1; 0.4 0 1 1; 0 0 0.6 1"
      />
    </rect>

    <!-- KE Bar (Right) -->
    <rect x="170" y="110" width="8" height="0" rx="4" fill="url(#ke-grad)">
      <animate
        attributeName="height"
        values="0; 75; 0; 75; 0"
        dur="4s"
        repeatCount="indefinite"
        calcMode="spline"
        keyTimes="0;0.25;0.5;0.75;1"
        keySplines="0.4 0 1 1; 0 0 0.6 1; 0.4 0 1 1; 0 0 0.6 1"
      />
      <animate
        attributeName="y"
        values="110; 35; 110; 35; 110"
        dur="4s"
        repeatCount="indefinite"
        calcMode="spline"
        keyTimes="0;0.25;0.5;0.75;1"
        keySplines="0.4 0 1 1; 0 0 0.6 1; 0.4 0 1 1; 0 0 0.6 1"
      />
    </rect>

    <!-- Ball -->
    <g>
      <circle r="6.5" fill="var(--danger)" filter="url(#glow)"/>
      <circle cx="-1.5" cy="-2" r="2.5" fill="#FFFFFF" opacity="0.6"/>
      <animateMotion
        dur="4s"
        repeatCount="indefinite"
        calcMode="spline"
        keyTimes="0;0.5;1"
        keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"
        keyPoints="0;1;0"
        rotate="auto">
        <mpath href="#energy-track"/>
      </animateMotion>
    </g>
  </g>
</svg>

<svg viewBox="0 0 200 140" width="100%" style="max-height:120px" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-reduced-motion: reduce) {
      .anim { animation: none; }
      .anim * { animateTransform { } }
    }
  </style>

  <!-- Background grid -->
  <line x1="20"  y1="12" x2="20"  y2="128" stroke="var(--ink)" stroke-width="0.5" opacity="0.15"/>
  <line x1="60"  y1="12" x2="60"  y2="128" stroke="var(--ink)" stroke-width="0.5" opacity="0.15"/>
  <line x1="100" y1="12" x2="100" y2="128" stroke="var(--ink)" stroke-width="0.5" opacity="0.15"/>
  <line x1="140" y1="12" x2="140" y2="128" stroke="var(--ink)" stroke-width="0.5" opacity="0.15"/>
  <line x1="180" y1="12" x2="180" y2="128" stroke="var(--ink)" stroke-width="0.5" opacity="0.15"/>
  <line x1="12" y1="12"  x2="188" y2="12"  stroke="var(--ink)" stroke-width="0.5" opacity="0.15"/>
  <line x1="12" y1="41"  x2="188" y2="41"  stroke="var(--ink)" stroke-width="0.5" opacity="0.15"/>
  <line x1="12" y1="70"  x2="188" y2="70"  stroke="var(--ink)" stroke-width="0.5" opacity="0.15"/>
  <line x1="12" y1="99"  x2="188" y2="99"  stroke="var(--ink)" stroke-width="0.5" opacity="0.15"/>
  <line x1="12" y1="128" x2="188" y2="128" stroke="var(--ink)" stroke-width="0.5" opacity="0.15"/>

  <!-- Axes -->
  <line x1="60" y1="12" x2="60" y2="128" stroke="var(--ink)" stroke-width="1.2"/>
  <polyline points="56,18 60,12 64,18" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <line x1="12" y1="99" x2="188" y2="99" stroke="var(--ink)" stroke-width="1.2"/>
  <polyline points="182,95 188,99 182,103" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Origin hatch -->
  <line x1="58" y1="99" x2="62" y2="99" stroke="var(--ink)" stroke-width="1.2"/>

  <!-- Ghost curves (family of exponents) -->
  <path d="M 20 83 Q 120 83, 170 41" fill="none" stroke="var(--ink)" stroke-width="1.0" opacity="0.2" stroke-linecap="round"/>
  <path d="M 20 95 Q 80 95, 110 12" fill="none" stroke="var(--ink)" stroke-width="1.0" opacity="0.2" stroke-linecap="round"/>

  <!-- Live exponential curve -->
  <path id="exp-curve" d="M 20 87 Q 100 87, 140 3" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Intersection highlight a^0 = 1 -->
  <circle cx="60" cy="82" r="2.5" fill="var(--ink)"/>

  <!-- Animated dot along the curve -->
  <g class="anim">
    <circle r="5" fill="var(--ink)">
      <animateMotion dur="3.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.45 0 0.55 1">
        <mpath href="#exp-curve"/>
      </animateMotion>
    </circle>
  </g>
</svg>

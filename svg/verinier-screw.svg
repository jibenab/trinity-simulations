<svg viewBox="0 0 200 140" width="100%" style="max-height:120px" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-reduced-motion: reduce) {
      .anim { animation: none; }
      .anim * { animateTransform { } }
    }
  </style>

  <!-- Background grid -->
  <line x1="20"  y1="12" x2="20"  y2="128" stroke="var(--ink)" stroke-width="0.5" opacity="0.15"/>
  <line x1="60"  y1="12" x2="60"  y2="128" stroke="var(--ink)" stroke-width="0.5" opacity="0.15"/>
  <line x1="100" y1="12" x2="100" y2="128" stroke="var(--ink)" stroke-width="0.5" opacity="0.15"/>
  <line x1="140" y1="12" x2="140" y2="128" stroke="var(--ink)" stroke-width="0.5" opacity="0.15"/>
  <line x1="180" y1="12" x2="180" y2="128" stroke="var(--ink)" stroke-width="0.5" opacity="0.15"/>
  <line x1="12" y1="12"  x2="188" y2="12"  stroke="var(--ink)" stroke-width="0.5" opacity="0.15"/>
  <line x1="12" y1="41"  x2="188" y2="41"  stroke="var(--ink)" stroke-width="0.5" opacity="0.15"/>
  <line x1="12" y1="70"  x2="188" y2="70"  stroke="var(--ink)" stroke-width="0.5" opacity="0.15"/>
  <line x1="12" y1="99"  x2="188" y2="99"  stroke="var(--ink)" stroke-width="0.5" opacity="0.15"/>
  <line x1="12" y1="128" x2="188" y2="128" stroke="var(--ink)" stroke-width="0.5" opacity="0.15"/>

  <!-- Fixed Jaw and Beam -->
  <g>
    <!-- Main scale beam -->
    <rect x="40" y="44" width="130" height="12" fill="var(--bg-alt)" stroke="var(--ink)" stroke-width="1.2"/>
    <!-- Lower fixed jaw -->
    <path d="M 40 56 L 40 95 L 32 85 L 32 56 Z" fill="var(--bg-alt)" stroke="var(--ink)" stroke-width="1.2"/>
    <!-- Upper fixed jaw -->
    <path d="M 40 44 L 40 15 L 32 25 L 32 44 Z" fill="var(--bg-alt)" stroke="var(--ink)" stroke-width="1.2"/>

    <!-- Ticks -->
    <!-- 1mm -->
    <path d="
      M 46 56 v -3 M 48 56 v -3 M 50 56 v -3 M 52 56 v -3
      M 56 56 v -3 M 58 56 v -3 M 60 56 v -3 M 62 56 v -3
      M 66 56 v -3 M 68 56 v -3 M 70 56 v -3 M 72 56 v -3
      M 76 56 v -3 M 78 56 v -3 M 80 56 v -3 M 82 56 v -3
      M 86 56 v -3 M 88 56 v -3 M 90 56 v -3 M 92 56 v -3
      M 96 56 v -3 M 98 56 v -3 M 100 56 v -3 M 102 56 v -3
      M 106 56 v -3 M 108 56 v -3 M 110 56 v -3 M 112 56 v -3
      M 116 56 v -3 M 118 56 v -3 M 120 56 v -3 M 122 56 v -3
      M 126 56 v -3 M 128 56 v -3 M 130 56 v -3 M 132 56 v -3
      M 136 56 v -3 M 138 56 v -3 M 140 56 v -3 M 142 56 v -3
      M 146 56 v -3 M 148 56 v -3 M 150 56 v -3 M 152 56 v -3
      M 156 56 v -3 M 158 56 v -3 M 160 56 v -3 M 162 56 v -3
      M 166 56 v -3 M 168 56 v -3 M 170 56 v -3
    " stroke="var(--ink)" stroke-width="0.5"/>
    
    <!-- 5mm -->
    <path d="
      M 54 56 v -6 M 74 56 v -6 M 94 56 v -6
      M 114 56 v -6 M 134 56 v -6 M 154 56 v -6
    " stroke="var(--ink)" stroke-width="0.8"/>
    
    <!-- 10mm -->
    <path d="
      M 44 56 v -8 M 64 56 v -8 M 84 56 v -8
      M 104 56 v -8 M 124 56 v -8 M 144 56 v -8 M 164 56 v -8
    " stroke="var(--ink)" stroke-width="1.0"/>
  </g>

  <!-- Measured Object -->
  <circle cx="55" cy="74" r="15" fill="var(--ink)" />

  <!-- Ghost slider at target position -->
  <g opacity="0.2">
    <rect x="70" y="42" width="38" height="16" fill="none" stroke="var(--ink)" stroke-width="1.0"/>
    <path d="M 70 58 L 70 95 L 78 85 L 78 58 Z" fill="none" stroke="var(--ink)" stroke-width="1.0"/>
    <path d="M 70 42 L 70 15 L 78 25 L 78 42 Z" fill="none" stroke="var(--ink)" stroke-width="1.0"/>
    <rect x="96" y="58" width="8" height="12" rx="1.5" fill="none" stroke="var(--ink)" stroke-width="1.0"/>
  </g>

  <!-- Slider (Animated) -->
  <g class="anim">
    <!-- Vernier Box around beam -->
    <rect x="0" y="42" width="38" height="16" fill="var(--bg-alt)" stroke="var(--ink)" stroke-width="1.2"/>
    
    <!-- Lower Sliding Jaw -->
    <path d="M 0 58 L 0 95 L 8 85 L 8 58 Z" fill="var(--bg-alt)" stroke="var(--ink)" stroke-width="1.2"/>
    
    <!-- Upper Sliding Jaw -->
    <path d="M 0 42 L 0 15 L 8 25 L 8 42 Z" fill="var(--bg-alt)" stroke="var(--ink)" stroke-width="1.2"/>

    <!-- Thumb Grip -->
    <rect x="26" y="58" width="8" height="12" rx="1.5" fill="var(--bg-alt)" stroke="var(--ink)" stroke-width="1.0"/>
    <path d="M 28 61 v 6 M 30 61 v 6 M 32 61 v 6" stroke="var(--ink)" stroke-width="0.5"/>

    <!-- Vernier Scale Ticks -->
    <path d="
      M 4.0 58 v -8
      M 5.8 58 v -3 M 7.6 58 v -3 M 9.4 58 v -3 M 11.2 58 v -3
      M 13.0 58 v -6
      M 14.8 58 v -3 M 16.6 58 v -3 M 18.4 58 v -3 M 20.2 58 v -3
      M 22.0 58 v -8
    " stroke="var(--ink)" stroke-width="0.8"/>

    <animateTransform
      attributeName="transform"
      type="translate"
      values="120 0; 70 0; 120 0"
      dur="3.5s"
      repeatCount="indefinite"
      calcMode="spline"
      keyTimes="0;0.5;1"
      keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"
    />
  </g>

  <!-- Annotation -->
  <path d="M 40 100 v 4 M 70 100 v 4 M 40 102 h 30" stroke="var(--ink-mute)" stroke-width="0.8"/>
  <text x="52" y="112" font-family="var(--mono)" font-size="9" fill="var(--ink-mute)">D</text>

</svg>

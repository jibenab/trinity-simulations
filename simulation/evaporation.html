<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Evaporation — Trinity Simulation Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../legacy-prototype/styles.css"/>
<style>
/* hide scrollbars on the html/body, let the internal panel scroll */
html, body { margin: 0; height: 100dvh; overflow: hidden; background: var(--bg); overscroll-behavior: none; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const Icon = ({ name, size = 18, stroke = 1.5 }) => {
  const common = { width: size, height: size, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: stroke, strokeLinecap: 'round', strokeLinejoin: 'round' };
  if (name === 'pause') return <svg {...common}><path d="M10 4H6v16h4V4z"/><path d="M18 4h-4v16h4V4z"/></svg>;
  if (name === 'reset') return <svg {...common}><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>;
  return <svg {...common}><path d="M6 4l14 8-14 8V4z"/></svg>;
};

const EvaporationSimulation = () => {
  const [playing, setPlaying] = useState(!window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const [temperature, setTemperature] = useState(40); // 5 to 90
  const [surfaceArea, setSurfaceArea] = useState(50); // 0 to 100
  const [airflow, setAirflow] = useState(10); // 0 to 100
  const [humidity, setHumidity] = useState(40); // 0 to 100
  const [activePreset, setActivePreset] = useState(null);

  const moleculesRef = useRef([]);
  const circleRefs = useRef([]);
  const poolTopLineRef = useRef(null);
  const lastTimeRef = useRef(performance.now());
  const rafRef = useRef(null);
  const animIntervalRef = useRef(null);
  
  const readoutsRef = useRef({
    waterLeft: null,
    evapRate: null,
    time: null
  });
  
  const stateRef = useRef({
    time: 0,
    evapTotal: 0,
    waterLeft: 100,
    evapRate: 0,
    temperature,
    surfaceArea,
    airflow,
    humidity
  });
  
  // Sync React state to refs for fast physics loop
  useEffect(() => {
    stateRef.current.temperature = temperature;
    stateRef.current.surfaceArea = surfaceArea;
    stateRef.current.airflow = airflow;
    stateRef.current.humidity = humidity;
  }, [temperature, surfaceArea, airflow, humidity]);
  
  const resetSimulation = () => {
     const N = 400;
     const mols = [];
     for(let i=0; i<N; i++) {
        mols.push({
           x: 400 + (Math.random() - 0.5) * 150,
           y: 360 - Math.random() * 50,
           vx: (Math.random() - 0.5),
           vy: (Math.random() - 0.5),
           state: 0 // 0=pool, 1=vapour, 2=gone
        });
     }
     moleculesRef.current = mols;
     stateRef.current.time = 0;
     stateRef.current.evapTotal = 0;
     stateRef.current.waterLeft = 100;
     stateRef.current.evapRate = 0;
     
     if (readoutsRef.current.waterLeft) readoutsRef.current.waterLeft.textContent = '100';
     if (readoutsRef.current.time) readoutsRef.current.time.textContent = '0.0';
     if (readoutsRef.current.evapRate) readoutsRef.current.evapRate.textContent = '0.0';
  };
  
  useEffect(() => {
    resetSimulation();
  }, []);
  
  // Physics loop
  useEffect(() => {
    if (!playing) {
      lastTimeRef.current = performance.now();
      return;
    }
    
    let evapAccum = 0;
    
    const tick = (now) => {
      const dt = Math.min((now - lastTimeRef.current) / 1000, 0.05);
      lastTimeRef.current = now;
      
      const st = stateRef.current;
      if (!st.lastEvapUpdate) st.lastEvapUpdate = now;
      st.time += dt;
      
      const W = 200 + (st.surfaceArea / 100) * 400;
      const poolLeft = 400 - W/2;
      const poolRight = 400 + W/2;
      const poolBottom = 380;
      
      let poolCount = 0;
      let newEscapes = 0;
      
      const tempJitter = (st.temperature / 100) * 3.5 + 0.5;
      const windForce = (st.airflow / 100) * 0.2;
      const effectiveHumidity = st.humidity * (1 - st.airflow / 100); 
      const escapeProb = Math.max(0, 0.15 * (1 - effectiveHumidity / 100));
      
      const mols = moleculesRef.current;
      for (let i = 0; i < mols.length; i++) {
         if (mols[i].state === 0) poolCount++;
      }
      
      const poolHeight = Math.max(5, (poolCount / 400) * 24000 / W);
      const poolTop = poolBottom - poolHeight;
      
      if (poolTopLineRef.current) {
         poolTopLineRef.current.setAttribute('y1', poolTop);
         poolTopLineRef.current.setAttribute('y2', poolTop);
         poolTopLineRef.current.setAttribute('x1', poolLeft - 5);
         poolTopLineRef.current.setAttribute('x2', poolRight + 5);
      }
      
      poolCount = 0;
      
      for (let i = 0; i < mols.length; i++) {
         let m = mols[i];
         if (m.state === 2) continue;
         
         if (m.state === 0) {
            m.vx += (Math.random() - 0.5) * tempJitter;
            m.vy += (Math.random() - 0.5) * tempJitter;
            m.vx *= 0.92;
            m.vy *= 0.92;
            // No gravity to let them completely fill the liquid volume
            
            m.x += m.vx;
            m.y += m.vy;
            
            if (m.x < poolLeft + 4) { m.x = poolLeft + 4; m.vx = Math.abs(m.vx); }
            else if (m.x > poolRight - 4) { m.x = poolRight - 4; m.vx = -Math.abs(m.vx); }
            
            if (m.y > poolBottom - 4) { m.y = poolBottom - 4; m.vy = -Math.abs(m.vy); }
            else if (m.y < poolTop) {
               let speed = Math.hypot(m.vx, m.vy);
               // Fast molecules at surface escape based on humidity penalty
               if (speed > 3.5 && Math.random() < escapeProb) {
                  m.state = 1;
                  newEscapes++;
               } else {
                  m.y = poolTop;
                  m.vy = Math.abs(m.vy);
               }
            }
            
            if (m.state === 0) poolCount++;
         } else if (m.state === 1) {
            m.vx += windForce + (Math.random() - 0.5) * 0.1;
            m.vy -= 0.05 + (Math.random() * 0.02);
            m.x += m.vx;
            m.y += m.vy;
            
            if (m.y < -20 || m.x > 820 || m.x < -20) {
               m.state = 2;
            }
         }
         
         let el = circleRefs.current[i];
         if (el) {
            if (m.state === 2) {
               el.setAttribute('opacity', '0');
            } else {
               el.setAttribute('cx', m.x);
               el.setAttribute('cy', m.y);
               if (m.state === 1) {
                  el.setAttribute('fill', 'var(--accent)');
                  el.setAttribute('r', '3.5');
                  el.setAttribute('opacity', '1');
               } else {
                  let speed = Math.hypot(m.vx, m.vy);
                  let isFast = speed > 3.5;
                  el.setAttribute('fill', isFast ? 'var(--dark-ink)' : 'var(--dark-mute)');
                  el.setAttribute('r', isFast ? '3.5' : '2.5');
                  el.setAttribute('opacity', '1');
               }
            }
         }
      }
      
      evapAccum += newEscapes;
      
      if (now - st.lastEvapUpdate > 500) {
         const elapsed = (now - st.lastEvapUpdate) / 1000;
         const currentRate = evapAccum / elapsed;
         st.evapRate = st.evapRate * 0.7 + currentRate * 0.3;
         evapAccum = 0;
         st.lastEvapUpdate = now;
         if (readoutsRef.current.evapRate) readoutsRef.current.evapRate.textContent = st.evapRate.toFixed(1);
      }
      
      st.waterLeft = Math.max(0, Math.round((poolCount / 400) * 100));
      
      if (readoutsRef.current.waterLeft) readoutsRef.current.waterLeft.textContent = st.waterLeft;
      if (readoutsRef.current.time) readoutsRef.current.time.textContent = st.time.toFixed(1);
      
      rafRef.current = requestAnimationFrame(tick);
    };
    
    lastTimeRef.current = performance.now();
    rafRef.current = requestAnimationFrame(tick);
    
    return () => cancelAnimationFrame(rafRef.current);
  }, [playing]);

  const applyPreset = (name, tTarget, aTarget, flowTarget, hTarget) => {
     setActivePreset(name);
     if (animIntervalRef.current) clearInterval(animIntervalRef.current);
     
     const steps = 20;
     let step = 0;
     const startT = temperature;
     const startA = surfaceArea;
     const startF = airflow;
     const startH = humidity;
     
     animIntervalRef.current = setInterval(() => {
        step++;
        const progress = step / steps;
        const ease = 1 - Math.pow(1 - progress, 3); // cubic ease out
        
        setTemperature(Math.round(startT + (tTarget - startT) * ease));
        setSurfaceArea(Math.round(startA + (aTarget - startA) * ease));
        setAirflow(Math.round(startF + (flowTarget - startF) * ease));
        setHumidity(Math.round(startH + (hTarget - startH) * ease));
        
        if (step >= steps) clearInterval(animIntervalRef.current);
     }, 16);
  };

  const W = 200 + (surfaceArea / 100) * 400;
  const poolLeft = 400 - W/2;
  const poolRight = 400 + W/2;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%', minWidth: 0 }}>
      {/* Zone 1: Header */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 16, gap: 12, flexWrap: 'wrap' }}>
        <div style={{ minWidth: 0 }}>
          <div className="eyebrow" style={{ color: 'var(--ink-mute)' }}>Simulation · Chemistry</div>
          <div className="display" style={{ fontSize: 36, marginTop: 6, letterSpacing: '-0.02em', fontWeight: 600 }}>Evaporation</div>
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          <button onClick={() => setPlaying(!playing)} aria-label={playing ? 'Pause' : 'Play'}
                  style={{ width: 44, height: 44, borderRadius: '50%', border: '1px solid var(--ink)', color: 'var(--ink)', background: 'transparent', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}>
            <Icon name={playing ? 'pause' : 'play'} size={20} />
          </button>
          <button onClick={resetSimulation} aria-label="Reset"
                  style={{ width: 44, height: 44, borderRadius: '50%', border: '1px solid var(--ink)', color: 'var(--ink)', background: 'transparent', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}>
            <Icon name="reset" size={20} />
          </button>
        </div>
      </div>

      {/* Zone 2: Stage */}
      <div style={{ background: 'var(--dark)', border: '1px solid var(--rule-soft)', borderRadius: 4, position: 'relative', overflow: 'hidden', height: 400, flexShrink: 0 }}>
        <svg viewBox="0 0 800 400" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
          {/* Grid */}
          {Array.from({ length: 10 }).map((_, i) => (
            <line key={'gy'+i} x1="0" y1={i * 40} x2="800" y2={i * 40} stroke="rgba(12,17,21,0.06)" strokeWidth="0.5"/>
          ))}
          {Array.from({ length: 20 }).map((_, i) => (
            <line key={'gx'+i} x1={i * 40} y1="0" x2={i * 40} y2="400" stroke="rgba(12,17,21,0.06)" strokeWidth="0.5"/>
          ))}
          
          {/* Molecules */}
          {Array.from({ length: 400 }).map((_, i) => (
            <circle key={i} ref={el => circleRefs.current[i] = el} cx="-100" cy="-100" r="3" opacity="0" />
          ))}
          
          {/* Beaker Outline */}
          <path d={`M ${poolLeft - 10} 150 L ${poolLeft} 380 L ${poolRight} 380 L ${poolRight + 10} 150`} fill="none" stroke="var(--ink)" strokeWidth="2" strokeLinejoin="round" />
          <line ref={poolTopLineRef} x1={poolLeft - 5} y1="380" x2={poolRight + 5} y2="380" stroke="var(--accent)" strokeWidth="1" strokeDasharray="4 4" opacity="0.5" />
        </svg>
        
        {/* Readouts */}
        <div style={{ position: 'absolute', bottom: 16, left: 16, fontFamily: 'var(--mono)', fontSize: 14, color: 'var(--dark-mute)', display: 'flex', flexDirection: 'column', gap: 6, letterSpacing: '0.04em' }}>
          <div>TEMP <span style={{ color: 'var(--dark-ink)', marginLeft: 12 }}>{temperature}°C</span></div>
          <div>EVAP RATE <span style={{ color: 'var(--dark-ink)', marginLeft: 12 }} ref={el => readoutsRef.current.evapRate = el}>0.0</span></div>
          <div>WATER LEFT <span style={{ color: 'var(--dark-ink)', marginLeft: 12 }}><span ref={el => readoutsRef.current.waterLeft = el}>100</span>%</span></div>
          <div>TIME <span style={{ color: 'var(--dark-ink)', marginLeft: 12 }}><span ref={el => readoutsRef.current.time = el}>0.0</span>s</span></div>
        </div>
      </div>
      
      {/* Presets */}
      <div style={{ display: 'flex', gap: 10, marginTop: 20, flexWrap: 'wrap' }}>
        {[
          { id: 'hot', label: 'HOT DAY', vals: [85, 50, 20, 30] },
          { id: 'windy', label: 'WINDY', vals: [40, 50, 90, 40] },
          { id: 'wide', label: 'WIDE DISH', vals: [40, 100, 10, 40] },
          { id: 'humid', label: 'HUMID JUNGLE', vals: [70, 50, 0, 95] },
          { id: 'cold', label: 'COLD & STILL', vals: [10, 50, 0, 50] },
        ].map(p => (
          <button key={p.id} onClick={() => applyPreset(p.id, ...p.vals)} 
                  style={{ fontSize: 13, padding: '8px 16px', border: '1px solid var(--ink)', borderRadius: 999, background: activePreset === p.id ? 'var(--ink)' : 'transparent', color: activePreset === p.id ? 'var(--bg)' : 'var(--ink)', fontFamily: 'var(--mono)', textTransform: 'uppercase', cursor: 'pointer', transition: 'all 0.15s ease' }}>
            {p.label}
          </button>
        ))}
      </div>

      {/* Zone 3: Parameters */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(240px, 1fr))', gap: 24, marginTop: 24, paddingBottom: 24, borderBottom: '1px solid var(--rule-soft)' }}>
        <label style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          <span style={{ fontFamily: 'var(--mono)', fontSize: 13, letterSpacing: '0.08em', textTransform: 'uppercase', display: 'flex', justifyContent: 'space-between' }}>
            <span style={{ color: 'var(--ink-mute)' }}>Temperature</span>
            <span style={{ color: 'var(--ink)', fontWeight: 500, fontSize: 15 }}>{temperature}°C</span>
          </span>
          <input type="range" min="5" max="90" value={temperature} onChange={e => { setTemperature(parseInt(e.target.value)); setActivePreset(null); }} style={{ accentColor: 'var(--accent)', height: 4 }} />
        </label>
        
        <label style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          <span style={{ fontFamily: 'var(--mono)', fontSize: 13, letterSpacing: '0.08em', textTransform: 'uppercase', display: 'flex', justifyContent: 'space-between' }}>
            <span style={{ color: 'var(--ink-mute)' }}>Surface Area</span>
            <span style={{ color: 'var(--ink)', fontWeight: 500, fontSize: 15 }}>{surfaceArea}</span>
          </span>
          <input type="range" min="0" max="100" value={surfaceArea} onChange={e => { setSurfaceArea(parseInt(e.target.value)); setActivePreset(null); }} style={{ accentColor: 'var(--accent)', height: 4 }} />
        </label>

        <label style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          <span style={{ fontFamily: 'var(--mono)', fontSize: 13, letterSpacing: '0.08em', textTransform: 'uppercase', display: 'flex', justifyContent: 'space-between' }}>
            <span style={{ color: 'var(--ink-mute)' }}>Airflow</span>
            <span style={{ color: 'var(--ink)', fontWeight: 500, fontSize: 15 }}>{airflow}</span>
          </span>
          <input type="range" min="0" max="100" value={airflow} onChange={e => { setAirflow(parseInt(e.target.value)); setActivePreset(null); }} style={{ accentColor: 'var(--accent)', height: 4 }} />
        </label>

        <label style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          <span style={{ fontFamily: 'var(--mono)', fontSize: 13, letterSpacing: '0.08em', textTransform: 'uppercase', display: 'flex', justifyContent: 'space-between' }}>
            <span style={{ color: 'var(--ink-mute)' }}>Humidity</span>
            <span style={{ color: 'var(--ink)', fontWeight: 500, fontSize: 15 }}>{humidity}%</span>
          </span>
          <input type="range" min="0" max="100" value={humidity} onChange={e => { setHumidity(parseInt(e.target.value)); setActivePreset(null); }} style={{ accentColor: 'var(--accent)', height: 4 }} />
        </label>
      </div>

      {/* Zone 4: Prompt */}
      <div style={{ marginTop: 24, fontSize: 18, color: 'var(--ink)', lineHeight: 1.5, marginBottom: 40 }}>
        Which slider empties the dish fastest — and why do the quick molecules leave first?
      </div>
    </div>
  );
};

const App = () => (
  <div className="shell" style={{ display: 'flex', flexDirection: 'column', height: '100dvh' }}>
    <div style={{ flex: 1, overflowY: 'auto', WebkitOverflowScrolling: 'touch', overscrollBehavior: 'contain' }}>
      <div style={{ maxWidth: 880, margin: '0 auto', padding: '32px 24px' }}>
        <EvaporationSimulation />
      </div>
    </div>
  </div>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

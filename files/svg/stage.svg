<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="100%" style="max-height:120px" aria-hidden="true" role="img">
  <style>
    @media (prefers-reduced-motion: reduce) {
      .anim { animation: none; }
      .anim * { animateTransform { } }
    }
  </style>

  <!-- Background grid -->
  <line x1="20"  y1="12" x2="20"  y2="128" stroke="var(--ink)" stroke-width="0.5" opacity="0.15"/>
  <line x1="60"  y1="12" x2="60"  y2="128" stroke="var(--ink)" stroke-width="0.5" opacity="0.15"/>
  <line x1="100" y1="12" x2="100" y2="128" stroke="var(--ink)" stroke-width="0.5" opacity="0.15"/>
  <line x1="140" y1="12" x2="140" y2="128" stroke="var(--ink)" stroke-width="0.5" opacity="0.15"/>
  <line x1="180" y1="12" x2="180" y2="128" stroke="var(--ink)" stroke-width="0.5" opacity="0.15"/>
  <line x1="12" y1="12"  x2="188" y2="12"  stroke="var(--ink)" stroke-width="0.5" opacity="0.15"/>
  <line x1="12" y1="41"  x2="188" y2="41"  stroke="var(--ink)" stroke-width="0.5" opacity="0.15"/>
  <line x1="12" y1="70"  x2="188" y2="70"  stroke="var(--ink)" stroke-width="0.5" opacity="0.15"/>
  <line x1="12" y1="99"  x2="188" y2="99"  stroke="var(--ink)" stroke-width="0.5" opacity="0.15"/>
  <line x1="12" y1="128" x2="188" y2="128" stroke="var(--ink)" stroke-width="0.5" opacity="0.15"/>

  <!-- Ghost : pre-division parent cell -->
  <ellipse cx="100" cy="70" rx="44" ry="32"
           fill="none" stroke="var(--ink)" stroke-width="1.0"
           opacity="0.12"/>

  <!-- Two daughter cell membranes (mid-telophase, overlapping) -->
  <circle cx="74"  cy="70" r="32" fill="none" stroke="var(--ink)" stroke-width="1.2"/>
  <circle cx="126" cy="70" r="32" fill="none" stroke="var(--ink)" stroke-width="1.2"/>

  <!-- Reformed nuclei (filled solid) -->
  <circle cx="74"  cy="70" r="7" fill="var(--ink)"/>
  <circle cx="126" cy="70" r="7" fill="var(--ink)"/>

  <!-- Uncoiling chromatin marks inside each nucleus area -->
  <g stroke="var(--ink)" stroke-width="1.0" fill="none" opacity="0.2">
    <path d="M 62 58 q 5 4 10 0"/>
    <path d="M 62 82 q 6 -4 12 0"/>
    <path d="M 114 58 q 5 4 10 0"/>
    <path d="M 114 82 q 6 -4 12 0"/>
  </g>

  <!-- Cleavage plane : the live, identifying feature (accent) -->
  <g class="anim">
    <line x1="100" y1="38" x2="100" y2="102"
          stroke="var(--accent)" stroke-width="1.5"
          stroke-dasharray="3 3" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset"
               from="0" to="-12" dur="3s"
               repeatCount="indefinite"
               calcMode="spline"
               keyTimes="0;1"
               keySplines="0.45 0 0.55 1"/>
    </line>
  </g>

  <!-- Pinch markers where the membranes meet (subtle tick) -->
  <g stroke="var(--ink)" stroke-width="1.0" opacity="0.2">
    <line x1="100" y1="38" x2="100" y2="42"/>
    <line x1="100" y1="98" x2="100" y2="102"/>
  </g>

  <!-- Annotation : phase letter, ink-mute, mono -->
  <text x="174" y="22"
        font-family="var(--mono)" font-size="10"
        fill="var(--ink-mute)" letter-spacing="0.06em">M</text>

</svg>
